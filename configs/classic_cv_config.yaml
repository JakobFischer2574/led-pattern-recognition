preprocessing:
  resize_width: null
  blur_kernel_size: 5

segmentation:
  use_combined_led_mask_for_classification: true
  hsv_lower:
    h: 35
    s: 50
    v: 80
  hsv_upper:
    h: 95
    s: 255
    v: 255
  min_excess_green: 30
  white_core:
    max_saturation: 80
    min_value: 230
  white_core_adjacency:
    dilate_kernel_size: 3
    dilate_iterations: 1

classification:
  brightness_threshold: 200
  min_mean_brightness: 160
  min_max_brightness: 220
  min_bright_pixel_ratio: 0.10
  min_green_pixel_ratio: 0.15
  min_max_green_score: 300
  min_largest_green_component_area: 500

debug:
  save_debug_images: true
